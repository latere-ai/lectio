#
# The credentials, applied once by hand and never from a kustomization: a
# secret an apply owns is a secret a re-apply can overwrite with the value
# that was in the tree. Copy this file, fill it, apply it, and keep the
# copy where your secrets live and not in a checkout.
#
#   kubectl -n lectio apply -f secrets.yaml
#
# lectiod-db and lectiod-s3 are required: a Pod applied without them
# waits. lectiod-model, lectiod-keys and lectiod-authorizer are optional,
# and an installation without one runs on what the comment beside it says.
# lectiod-model and lectiod-keys are 2 sources of the key a page is read
# with: an installation applies one of them, or neither.
#
# Every value below is a placeholder. No key is read by 2 variables.
---
# Required, read by both roles. LECTIO_DATABASE_URL is the direct endpoint
# of the database: the API runs the migrations over it at start, and the
# migrator holds a session lock across its statements, which a
# transaction-mode pooler loses between 2 of them.
#
# LECTIO_DATABASE_POOL_URL is optional: the endpoint of such a pooler,
# which the serving path opens instead. Remove the key where there is no
# pooler, and the serving path opens the direct endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: lectiod-db
  namespace: lectio
type: Opaque
stringData:
  LECTIO_DATABASE_URL: "postgres://lectio:...@postgres.example.com:5432/lectio?sslmode=require"
  LECTIO_DATABASE_POOL_URL: "postgres://lectio:...@pooler.example.com:6432/lectio?sslmode=require"
---
# Required, read by both roles. The key pair the object store is reached
# with. It needs to read, write and delete objects under the bucket and
# the prefix the ConfigMap names, and nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: lectiod-s3
  namespace: lectio
type: Opaque
stringData:
  LECTIO_S3_ACCESS_KEY: "..."
  LECTIO_S3_SECRET_KEY: "..."
---
# Optional, read by the workers alone. The key every reader's endpoint is
# called with, for every group, while LECTIO_KEYS is `static`, its
# default. An endpoint that takes no key, one the installation runs itself
# for example, needs no Secret. Delete this document where lectiod-keys
# below is applied: a worker given both does not start.
apiVersion: v1
kind: Secret
metadata:
  name: lectiod-model
  namespace: lectio
type: Opaque
stringData:
  LECTIO_MODEL_KEY: "..."
---
# Optional, read by the workers alone. The endpoint that issues each group
# the key its pages are read with, and the bearer lectiod sends it. With
# it, a gateway attributes a tenant's model spend to that tenant and
# bounds it by the tenant's budget. With no Secret every page is read with
# the key of lectiod-model.
#
# The Secret is one half of the setting. The other is LECTIO_KEYS:
# "endpoint" in the ConfigMap lectiod, which both roles read. A worker
# given this Secret while LECTIO_KEYS is `static` does not start, and
# neither does one given LECTIO_KEYS=endpoint without it. Delete this
# document where the key source stays `static`.
#
# The bearer is this endpoint's own, and not the authorizer's: the API
# holds the authorizer's and must hold nothing that obtains a tenant's
# key. The address and its bearer are one Secret and rotate together.
#
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: lectiod-keys
  namespace: lectio
type: Opaque
stringData:
  LECTIO_KEYS_URL: "https://keys.example.com/lectio"
  LECTIO_KEYS_TOKEN: "..."
---
# Optional, read by the API alone. The endpoint that decides what a caller
# may do and returns the limits the caller is held to, and the bearer
# lectiod sends it. With no Secret the owner policy decides: a subject
# acts on what it owns.
#
# The address and its bearer are one Secret and rotate together: an
# address with no bearer and a bearer with no address are both an
# installation that believes it asks an authorizer and does not.
#
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: lectiod-authorizer
  namespace: lectio
type: Opaque
stringData:
  LECTIO_AUTHORIZER_URL: "https://authz.example.com/authorize"
  LECTIO_AUTHORIZER_TOKEN: "..."
