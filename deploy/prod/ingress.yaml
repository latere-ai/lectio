# The core's one rule at the platform origin: /v1/parsing on api.latere.ai,
# beside /v1/models, /v1/environments and /v1/agents, forwarded without a
# rewrite, because the core serves its API under LECTIO_BASE_PATH. There is
# no tls block and no issuer annotation: the host's certificate is the
# origin's, which arcad's Ingress holds for every rule on api.latere.ai.
#
# The body limit covers the largest file a parse reads, the 256 MiB of the
# decider's ceiling, with room for the framing of an upload. An upload is
# passed to the core as it arrives and is not first written to the
# controller's disk, which would hold a second copy of every file.
#
# A submit may be held for 60 seconds (Prefer: wait), so the read and send
# timeouts are twice that; the default would cut a held submit at its end.
#
# The console does not come through here: platformd reaches the core in the
# cluster, at the Service, under the same path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lectiod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 257m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: api.latere.ai
      http:
        paths:
          - path: /v1/parsing
            pathType: Prefix
            backend:
              service:
                name: lectiod
                port:
                  name: public
