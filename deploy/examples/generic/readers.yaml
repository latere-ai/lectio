#
# The readers and the policy: which models read a page, and in what order
# they are tried. The base mounts this ConfigMap at /etc/lectio, where
# LECTIO_CONFIG points, and both roles read every .yaml, .yml and .json
# key of it at start, in name order. A change takes a new roll to reach
# the Pods.
#
# One Reader and one Policy, with example values. The Policy names the one
# reader for a page, for a figure and for an extraction: without a describe
# chain or an extract chain, a request to describe figures or to extract
# runs only when it names its describer or its extractor. The endpoint is any
# that speaks chat completions with image input, a gateway included, and
# the model is a name that endpoint knows. The key the endpoint is called
# with is not here: it is LECTIO_MODEL_KEY, in the Secret lectiod-model,
# or, with LECTIO_KEYS=endpoint, the key the endpoint of the Secret
# lectiod-keys issues the page's group.
# specs/008-readers.md lists every member of both documents.
#
# To read a PDF's own text before any model is called, declare a second
# Reader, of the text adapter, and name it first in the chain. It needs
# no endpoint, no model and no key, and a page it cannot read without
# guessing goes to the reader after it:
#
#     apiVersion: lectio.latere.ai/v1
#     kind: Reader
#     metadata: { name: own }
#     spec: { adapter: text }
#
#     # and in the Policy:
#     spec:
#       read: { chain: [own, default] }
apiVersion: v1
kind: ConfigMap
metadata:
  name: lectiod-readers
data:
  readers.yaml: |
    apiVersion: lectio.latere.ai/v1
    kind: Reader
    metadata: { name: default }
    spec:
      adapter: chat
      endpoint: https://models.example.com/v1
      model: example-vision-model
      image: { dpi: 160, longEdge: 2048, format: png }
      constrained: true
    ---
    apiVersion: lectio.latere.ai/v1
    kind: Policy
    metadata: { name: default }
    spec:
      read: { chain: [default] }
      describe: { chain: [default] }
      extract: { chain: [default] }
