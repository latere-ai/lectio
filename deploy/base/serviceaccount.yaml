#
# The account both roles run as. lectiod calls no Kubernetes API, so no
# Role is bound and no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lectiod
  labels:
    app.kubernetes.io/name: lectiod
automountServiceAccountToken: false
