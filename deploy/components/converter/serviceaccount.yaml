#
# The sidecar's own account, so that nothing granted to another account of
# the namespace is granted to it. No Role is bound and no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lectio-convert
  labels:
    app.kubernetes.io/name: lectio-convert
automountServiceAccountToken: false
