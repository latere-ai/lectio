openapi: 3.1.0
info:
  title: Lectio
  version: 0.0.0
  summary: Parse a file into pages, blocks, tables, and fields.
  description: |
    A parse turns one file into one document. It is asynchronous: a submit
    answers at once, and the document is read as it is built, one page at a
    time or whole.

    What a parse does is fixed at submit by a small set of options, each
    independent of the others: which pages, which reader, in which class
    and with which priority, how many failed pages are tolerated, and by
    when. What a caller sees of the result is chosen when it is read: the
    format, the pages, how tables are written. Reading a result in another
    form never runs the parse again. Chunking is a view of a document and
    extraction is a request against one, so neither is a submit option.

    A body with a field this document does not describe is refused with
    `unknown_field`. A route marked `x-lectio-status: planned` is part of the
    contract and answers `501 not_implemented` until it is built; none is
    marked today. A route that one kind of server does not build says so
    and lists the `501`.

    Every error has the same shape: one `code` to branch on, one `message`
    for a person, and `details` for a developer. Any operation may answer
    `401`, `403`, `429`, `500` and `503` in that shape; an operation lists
    the other statuses it answers. An address that is not routed is `404
    not_found`, and one that is routed under another method is `405
    method_not_allowed`.

    A result that does not exist yet is `409`, with `page_not_ready` or
    `document_not_ready` and `details.retryable: true`: the address is
    right and the answer is not there yet. `404` means it will not come.

    The server also answers `GET /healthz`, outside the base path and
    without a token.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /v1
    description: The default base path. A deployment may mount the API under another.

security:
  - bearer: []

tags:
  - name: files
    description: Source files. A file is a snapshot with a retention period, kept for the parses that read it.
  - name: parses
    description: Submitting a parse and following it.
  - name: results
    description: Reading what a parse produced, whole or one object at a time.
  - name: figures
    description: Saying what the figures of a parsed document show.
  - name: fields
    description: Extracting an object in the shape of a schema from a parsed document.
  - name: operations
    description: What is configured and what is running.

paths:
  /files:
    post:
      tags: [files]
      operationId: createFile
      summary: Upload a file
      description: |
        The body is the file itself, with its media type in `Content-Type`,
        or `multipart/form-data` with one part named `file`. It is stored
        while it is hashed and never held whole in memory. Uploading bytes
        the caller already has returns the existing file with `200`.
      parameters:
        - name: name
          in: query
          description: The file's name, used only to help tell its type when the content does not.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: The caller already has these bytes., content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "201": { description: Stored., content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /files/{file}:
    parameters:
      - $ref: "#/components/parameters/file"
    get:
      tags: [files]
      operationId: getFile
      summary: Read a file's metadata
      responses:
        "200": { description: The file., content: { application/json: { schema: { $ref: "#/components/schemas/File" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete a file
      description: Refused with `not_terminal` while a parse that has not ended reads it.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses:
    post:
      tags: [parses]
      operationId: createParse
      summary: Submit a parse
      description: |
        Answers `202` with the parse. With `Prefer: wait=<seconds>` the
        answer is held until the parse ends or the wait runs out, and is
        `200` when it ended.

        A submit always makes a parse of its own, with its own id, labels
        and origin. What is not repeated is the reading: a page that an
        earlier parse of the same caller read whole, from the same bytes
        with the same readers, is taken from that read and no model is
        called for it, unless `reuse` is false. Such a page says
        `reused: true` and the parse counts it in `progress.pages_reused`.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Makes the submit safe to repeat for 24 hours. The same key with a different body is `idempotency_conflict`.
          schema: { type: string, maxLength: 255 }
        - name: Prefer
          in: header
          description: "`wait=<seconds>`, at most 60."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParseRequest" }
      responses:
        "200": { description: The parse ended within the wait., content: { application/json: { schema: { $ref: "#/components/schemas/Parse" } } } }
        "202": { description: Accepted., content: { application/json: { schema: { $ref: "#/components/schemas/Parse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [parses]
      operationId: listParses
      summary: List parses, newest first
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ParseState" } }
        - { name: file, in: query, schema: { type: string } }
        - { name: origin.path, in: query, description: Parses submitted with this origin path., schema: { type: string } }
        - { name: label, in: query, description: "`key=value`; may repeat, and every one must match.", schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: A page of parses., content: { application/json: { schema: { $ref: "#/components/schemas/ParseList" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /parses/{parse}:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [parses]
      operationId: getParse
      summary: Read a parse
      description: Read a parse's state, progress, and usage.
      responses:
        "200": { description: The parse., content: { application/json: { schema: { $ref: "#/components/schemas/Parse" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [parses]
      operationId: deleteParse
      summary: Delete a parse
      description: |
        Delete a parse and everything it wrote.

        Refused with `not_terminal` for a parse that has not ended; cancel it first.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/cancel:
    parameters:
      - $ref: "#/components/parameters/parse"
    post:
      tags: [parses]
      operationId: cancelParse
      summary: Stop a parse
      description: |
        No further page is read, and a page being read is abandoned. What
        was already read stays readable. Canceling a parse that has ended
        is `already_terminal`.
      responses:
        "200": { description: The parse, canceled or on its way., content: { application/json: { schema: { $ref: "#/components/schemas/Parse" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/retry:
    parameters:
      - $ref: "#/components/parameters/parse"
    post:
      tags: [parses]
      operationId: retryParse
      summary: Retry failed pages
      description: |
        Read again the pages that failed.

        Pages that succeeded are not read again. The answer is the parse
        as the retry left it: `running`, with the failed pages open and
        its other pages readable as before. It has as long from the retry
        as its submit gave it, and when its pages have settled it is
        assembled again and ends.

        A parse that has not ended is `not_terminal`. One with nothing to
        read again is `conflict`: no page of it failed, or it ended
        before its pages were all read, by a cancel, its deadline or a
        file that could not be prepared. Submit such a file again. A
        parse of which an extraction or a figure is queued or running is
        `conflict` too, until that work has ended: a retry writes again
        the pages it reads. The parse stays in its group: a group that
        already holds as many parses that have not ended as it may is
        `queue_full`, and one whose day does not hold the failed pages is
        `budget_exhausted`.

        A development server does not read pages again and answers `501
        not_implemented`.
      responses:
        "202": { description: Queued again., content: { application/json: { schema: { $ref: "#/components/schemas/Parse" } } } }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /parses/{parse}/events:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [parses]
      operationId: streamParse
      summary: Follow a parse
      description: |
        Follow a parse as server-sent events, until it ends.

        `page` says a page settled, with `page`, its `state` (`succeeded`
        or `failed`) and its `error` when it failed. `progress` is the
        parse's `progress` as it stands, and `state` its `state`, with
        its `error` when it failed. A stream begins with the pages that
        settled so far, then the progress and the state, and sends each
        again as it changes. It ends after the `state` of a parse that
        has ended.

        Each event carries an id, a number that only grows within a
        parse. `Last-Event-ID` resumes after it: the pages that settled
        after that event are sent, and where the parse stands now. The
        ids are read from stored rows, so they are the same on every
        replica and after a restart. A page is sent for as long as the
        parse runs, and after it for a parse that ended with a failed
        page; a stream opened on a parse that ended with every page read
        sends its progress and its state.

        The server sends a comment line while nothing changes, and ends a
        stream it has held for some minutes: connect again with the id of
        the last event. A `retry` field names the delay to wait before
        that.

        A development server does not stream events and answers `501
        not_implemented`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last event the client saw. An id the stream did not send is read as none.
          schema: { type: string }
      responses:
        "200": { description: The stream., content: { text/event-stream: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /parses/{parse}/document:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [results]
      operationId: getDocument
      summary: Read the document
      description: |
        As JSON this is the document's index: its pages without their
        blocks, the tables that continue across pages, the outline, and
        usage. As Markdown or text it is the content in reading order.
        Readable once the parse has assembled its pages, which a parse
        with failed pages still does.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, markdown, text], default: json }
        - name: pages
          in: query
          description: Limits a Markdown or text rendering to these pages, in the syntax of a submit's `pages`.
          schema: { type: string }
        - name: tables
          in: query
          description: How a table is written in Markdown. `auto` writes Markdown unless a cell spans.
          schema: { type: string, enum: [auto, markdown, html], default: auto }
        - name: repeated
          in: query
          description: Whether running headers and footers are printed on every page or once.
          schema: { type: string, enum: [once, keep, drop], default: once }
        - name: page_breaks
          in: query
          description: Whether a Markdown rendering marks where each page begins.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The document.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Document" } }
            text/markdown: { schema: { type: string } }
            text/plain: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/pages:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [results]
      operationId: listPages
      summary: List pages
      description: List the pages and their states, without blocks.
      responses:
        "200": { description: The pages., content: { application/json: { schema: { $ref: "#/components/schemas/PageList" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /parses/{parse}/pages/{page}:
    parameters:
      - $ref: "#/components/parameters/parse"
      - $ref: "#/components/parameters/page"
    get:
      tags: [results]
      operationId: getPage
      summary: Read one page
      description: |
        Read one page with its blocks.

        Readable as soon as that page has been read, while the parse is
        still running. A page not read yet is `409 page_not_ready`. A page
        the parse does not read, or one it ended without reading, is
        `404 page_not_found`.
      responses:
        "200": { description: The page., content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/pages/{page}/image:
    parameters:
      - $ref: "#/components/parameters/parse"
      - $ref: "#/components/parameters/page"
    get:
      tags: [results]
      operationId: getPageImage
      summary: Read a page image
      description: |
        Read the image of a page that a reader saw.

        The image is the one sent to the reader, so a block's box drawn over it lines up. A page read natively has none.
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/blocks:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [results]
      operationId: listBlocks
      summary: Read every block
      description: |
        Read every block of the pages read so far.

        The bulk read: all blocks in page and reading order, one per line,
        in one answer. It answers while the parse runs, with the pages
        read so far. A block's `ref` says which page it is on.
      parameters:
        - name: pages
          in: query
          description: Limits the answer to these pages, in the syntax of a submit's `pages`.
          schema: { type: string }
      responses:
        "200": { description: One block per line., content: { application/x-ndjson: { schema: { $ref: "#/components/schemas/Block" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/blocks/{ref}:
    parameters:
      - $ref: "#/components/parameters/parse"
      - name: ref
        in: path
        required: true
        description: "`<page>.<order>`"
        schema: { type: string, pattern: '^[1-9][0-9]*\.[1-9][0-9]*$' }
    get:
      tags: [results]
      operationId: getBlock
      summary: Read one block
      responses:
        "200": { description: The block., content: { application/json: { schema: { $ref: "#/components/schemas/Block" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/blocks/{ref}/image:
    parameters:
      - $ref: "#/components/parameters/parse"
      - name: ref
        in: path
        required: true
        description: "`<page>.<order>`"
        schema: { type: string, pattern: '^[1-9][0-9]*\.[1-9][0-9]*$' }
    get:
      tags: [results]
      operationId: getBlockImage
      summary: Read a block image
      description: |
        Read a block as it looks on its page.

        The page's image cut to the block's box: a figure, a table, a
        signature as an image of its own. The page image is the one the
        reader saw, so the cut is the region the box names. A block with
        no box, and a block of a page that was not read from an image, is
        `404 block_not_found`.
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/figures:
    parameters:
      - $ref: "#/components/parameters/parse"
    post:
      tags: [figures]
      operationId: createFigures
      summary: Describe figures
      description: |
        Describe the figures of a parse.

        A reader that finds a figure says where it is. This asks a
        describer what each figure shows: the figure is cut from its
        page's image and described alone, and the answer is written onto
        the figure's block as `description`, with `figure.type` and, when
        the page's reader gave the block no text, the words printed in
        the figure as `text`.

        It is a request against a parse that has ended, so figures can be
        described later, for some pages, and no page is read again. Only
        a figure that has a box, on a page read from an image, and has no
        description yet is described, unless `redo` is true. A figure
        described once from the same bytes by the same describers is not
        described again by a later parse. One run at a time: a request
        while a run is in flight is `conflict`. A parse that has not
        ended is `not_terminal`. With no describer configured, or one
        named that is not, it is `reader_not_found`.

        A run describes at most 1,000 figures. A request whose pages hold
        more that it would describe is `too_many_pages` and starts
        nothing: name fewer pages, and describe the parse a range of
        pages at a time. A figure that has a description does not count
        unless `redo` is true.

        Answers `202` with the run. With `Prefer: wait=<seconds>` the
        answer is held until the run ends or the wait runs out, and is
        `200` when it ended. A run succeeds when it described any figure
        it set out to; a figure it lost says why in the listing.

        Each figure is one call, queued with the pages of every parse and
        read with the key its parse's pages are read with. A run has as
        long as a parse submitted with no deadline has: the figures it
        has not described by then are lost to it.
      parameters:
        - name: Prefer
          in: header
          description: "`wait=<seconds>`, at most 60."
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FiguresRequest" }
      responses:
        "200": { description: The run ended within the wait., content: { application/json: { schema: { $ref: "#/components/schemas/Figures" } } } }
        "202": { description: Accepted., content: { application/json: { schema: { $ref: "#/components/schemas/Figures" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [figures]
      operationId: listFigures
      summary: List figures
      description: |
        List a parse's figures and the run that describes them.

        Every figure block of the parse, described or not. `run` is absent when no run was started.
      responses:
        "200": { description: The figures., content: { application/json: { schema: { $ref: "#/components/schemas/Figures" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /parses/{parse}/chunks:
    parameters:
      - $ref: "#/components/parameters/parse"
    get:
      tags: [results]
      operationId: listChunks
      summary: Read chunks for retrieval
      description: |
        Read the document as chunks for retrieval.

        Chunks are computed when they are read, from the stored blocks, so
        another strategy or size needs no new parse. Each chunk lists the
        pages and blocks it covers.
      parameters:
        - name: by
          in: query
          schema: { type: string, enum: [page, section], default: section }
        - name: max_chars
          in: query
          description: A chunk longer than this is split at block boundaries.
          schema: { type: integer, minimum: 200, maximum: 100000, default: 6000 }
      responses:
        "200": { description: One chunk per line., content: { application/x-ndjson: { schema: { $ref: "#/components/schemas/Chunk" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /parses/{parse}/fields:
    parameters:
      - $ref: "#/components/parameters/parse"
    post:
      tags: [fields]
      operationId: createField
      summary: Extract an object
      description: |
        Extract an object in the shape of a schema.

        The object is filled from the document's text by a text model,
        and each value in it cites the blocks it was read from. A value
        the document does not state is left out and is never made up, so
        an object that lacks a member its schema requires fails the
        extraction with `schema_not_satisfied`. The extraction is a
        request against a parse and no option of a submit: a new schema
        needs no new parse and reads no page again.

        The schema is checked when the request arrives. One that does not
        compile, is larger than 64 KiB, nests deeper than 16 levels, is
        of another dialect than draft 2020-12, does not describe an
        object at its root, or refers to anything outside itself is
        `invalid_schema`. So is one that applies more than 256
        subschemas to one value through `$ref`, `$dynamicRef`, `allOf`,
        `anyOf`, `oneOf`, `not`, `if`, `then`, `else` and
        `dependentSchemas`, each counted as often as it is reached, one
        that applies a subschema to the value it is itself applied to
        without end, one whose patterns compile to more than 16,384
        steps together, where a repetition with a count is as many
        copies of what it repeats, and one that gives one
        `$dynamicAnchor` to 2 subschemas. A schema that recurs through
        its members or its items is taken. An object that would take
        more work to check than 2,097,152 applications of the schema
        fails the extraction with `schema_not_satisfied`. A second request with a name the parse already
        has is `conflict`, and so is one for a parse that holds 64
        extractions. With no extractor configured, or one named that is
        not, it is `reader_not_found`.

        Answers `202` with the extraction, `pending`. It may be requested
        while the parse is running: it waits for the parse to end, and
        then runs over the document the parse ended with, which is every
        page that was read. It is read with the key its parse's pages are
        read with, and has as long from when it is queued as a parse
        submitted with no deadline has.

        A development server does not extract and answers `501
        not_implemented`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldRequest" }
      responses:
        "202": { description: Accepted., content: { application/json: { schema: { $ref: "#/components/schemas/Field" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    get:
      tags: [fields]
      operationId: listFields
      summary: List a parse's extractions
      description: |
        List the extractions of a parse, by name, each as it stands.

        A development server answers `501 not_implemented`.
      responses:
        "200": { description: The extractions., content: { application/json: { schema: { $ref: "#/components/schemas/FieldList" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /parses/{parse}/fields/{name}:
    parameters:
      - $ref: "#/components/parameters/parse"
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,62}$' } }
    get:
      tags: [fields]
      operationId: getField
      summary: Read one extraction
      description: |
        Read one extraction of a parse.

        It is `pending` from its request until it ends, `succeeded` with
        its object and its citations, or `failed` with why. A parse with
        no extraction of the name is `not_found`.

        A development server answers `501 not_implemented`.
      parameters:
        - name: resolve
          in: query
          description: Returns each citation with its page and box, and not as a ref alone.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: The extraction., content: { application/json: { schema: { $ref: "#/components/schemas/Field" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /openapi.yaml:
    get:
      tags: [operations]
      operationId: getContract
      summary: Read this document
      security: []
      responses:
        "200": { description: The contract., content: { application/yaml: { schema: { type: string } } } }

  /readers:
    get:
      tags: [operations]
      operationId: listReaders
      summary: List the configured readers
      description: List the configured readers and what each accepts.
      responses:
        "200": { description: The readers., content: { application/json: { schema: { $ref: "#/components/schemas/ReaderList" } } } }

  /usage:
    get:
      tags: [operations]
      operationId: getUsage
      summary: Read usage
      description: |
        Read what was consumed, summed by a key over fixed intervals.

        The meters count the pages that were read, the model calls made
        for them, and the tokens those calls took in and gave out. A call
        that failed or was told to wait is counted as the call it was, so
        the sums are what was spent and not only what was useful. A page
        counts in the hour it was read in, under the reader that read
        it; a page of a format that needs no reader counts under the
        reader with no name.

        The intervals are hours or days in UTC. `from` is moved back to
        the beginning of its interval and `to` on to the end of its own,
        and the answer says the span it covers. With no `to` the read
        ends now, and with no `from` it goes back 24 hours, or 30 days
        for `interval=day`. A read spans at most 1000 intervals. An
        interval with nothing in it has no sum.

        The answer holds what the caller may see: its own usage, unless
        the authorizer lets it see more. `owner` and `group` ask for one
        owner's or one group's, which the authorizer may refuse.

        A development server keeps no meter and answers `501
        not_implemented`.
      parameters:
        - { name: by, in: query, description: The key the sums are grouped by., schema: { type: string, enum: [group, owner, reader], default: group } }
        - { name: interval, in: query, schema: { type: string, enum: [hour, day], default: hour } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: owner, in: query, description: Limits the read to one owner., schema: { type: string } }
        - { name: group, in: query, description: Limits the read to one group., schema: { type: string } }
      responses:
        "200": { description: The sums., content: { application/json: { schema: { $ref: "#/components/schemas/UsageReport" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /queue:
    get:
      tags: [operations]
      operationId: getQueue
      summary: Read the queue
      description: |
        Read what is waiting and running, per group and project.

        Each group is listed with its weight and its bounds, how many of
        its parses have not ended, and its queued and running tasks per
        class, and each of its projects with the same. A task is a unit
        of work of a parse, a page for the most part, and a running task
        is one a worker holds. Each reader's pool is listed with the
        calls it has in flight against its bound, whether its breaker
        admits calls, and the keys of it that a rate limit paused.

        The answer holds what the caller may see: its own group, unless
        the authorizer lets it see more, and then every group that holds
        a parse that has not ended. `group` asks for one group, which the
        authorizer may refuse; a group that is named is listed whether it
        holds work or not. A caller that sees some groups is told the
        calls in flight that are theirs, and their own keys.

        A development server has one queue for every caller and answers
        `501 not_implemented`.
      parameters:
        - { name: group, in: query, description: Limits the read to one group., schema: { type: string } }
      responses:
        "200": { description: The queue., content: { application/json: { schema: { $ref: "#/components/schemas/Queue" } } } }
        "501": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    file:
      name: file
      in: path
      required: true
      schema: { type: string, pattern: '^fil_[0-9A-Z]{26}$' }
    parse:
      name: parse
      in: path
      required: true
      schema: { type: string, pattern: '^prs_[0-9A-Z]{26}$' }
    page:
      name: page
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Error:
      description: The request was refused or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: What a caller branches on.
              enum:
                - invalid_request
                - unknown_field
                - invalid_pages
                - invalid_schema
                - unsupported_media_type
                - file_too_large
                - too_many_pages
                - source_unreachable
                - missing_token
                - invalid_token
                - forbidden
                - reader_not_permitted
                - reader_not_found
                - file_not_found
                - parse_not_found
                - page_not_found
                - page_not_ready
                - block_not_found
                - document_not_ready
                - conflict
                - idempotency_conflict
                - not_terminal
                - already_terminal
                - rate_limited
                - queue_full
                - budget_exhausted
                - not_implemented
                - not_found
                - method_not_allowed
                - authorizer_unavailable
                - capability_unsupported
                - internal
            message: { type: string, description: One fixed sentence for a person. }
            details:
              type: object
              description: For a developer. `reason` says what happened in this instance, and `retryable` whether the same request may succeed later.
              properties:
                reason: { type: string }
                retryable: { type: boolean }
                field: { type: string }

    File:
      type: object
      required: [id, size, sha256, media_type, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        media_type: { type: string, description: What the content was detected to be. }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ParseRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          description: Where the bytes come from. Exactly one member.
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            file: { type: string, description: The id of an uploaded file. }
            url: { type: string, format: uri, description: Fetched once, before any page is read. Only a publicly routable address is fetched. }
        origin:
          description: Where the file lives for the caller. Stored, returned, and filterable; never interpreted.
          type: object
          additionalProperties: false
          properties:
            store: { type: string, maxLength: 64 }
            path: { type: string, maxLength: 1024 }
            version: { type: string, maxLength: 64 }
        pages:
          type: string
          description: Which pages, counted from 1, as ranges and numbers separated by commas. An open range runs to the end. Absent means all.
          examples: ["1-3,7", "5-"]
        reader:
          type: string
          description: The name of a configured reader. Naming one pins it, and the parse never falls back to another. Absent, the routing policy decides.
        languages:
          type: array
          maxItems: 8
          description: Hints for the reader, most likely first, as BCP 47 tags.
          items: { type: string, maxLength: 35 }
        class:
          type: string
          enum: [interactive, batch]
          default: interactive
          description: Interactive work goes ahead of batch work and never starves it.
        priority:
          type: integer
          default: 0
          description: Orders the caller's own parses. It never moves one caller ahead of another.
        allow_failed_pages:
          type: integer
          minimum: 0
          default: 0
          description: How many pages may fail and still leave the parse succeeded. Pages that were read are kept either way.
        deadline:
          type: string
          description: How long the parse may take from submit, as a duration such as `10m`. Past it the parse fails with `deadline_exceeded`.
        reuse:
          type: boolean
          default: true
          description: Whether a page an earlier parse already read whole, from the same bytes with the same readers, is taken from that read. The parse is a new one either way.
        labels:
          type: object
          maxProperties: 16
          description: The caller's own keys and values, returned and filterable.
          additionalProperties: { type: string, maxLength: 256 }

    ParseState:
      type: string
      enum: [queued, running, succeeded, failed, canceled]

    Parse:
      type: object
      required: [id, state, class, priority, file, progress, usage, created_at]
      properties:
        id: { type: string }
        owner: { type: string }
        state: { $ref: "#/components/schemas/ParseState" }
        class: { type: string, enum: [interactive, batch] }
        priority: { type: integer }
        file: { type: string }
        origin: { type: object }
        pages: { type: string }
        reader: { type: string }
        languages: { type: array, items: { type: string } }
        allow_failed_pages: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        progress:
          type: object
          required: [stage, pages_total, pages_done, pages_failed]
          properties:
            stage: { type: string, enum: [queued, preparing, reading, assembling, done] }
            pages_total: { type: integer }
            pages_done: { type: integer }
            pages_failed: { type: integer }
            pages_reused: { type: integer, description: How many of the pages done were taken from an earlier read and cost no model call. }
            waiting:
              type: string
              enum: [turn, capacity]
              description: Why nothing is moving, when nothing is.
        usage: { $ref: "#/components/schemas/Usage" }
        error: { $ref: "#/components/schemas/Problem" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }

    ParseList:
      type: object
      required: [parses]
      properties:
        parses: { type: array, items: { $ref: "#/components/schemas/Parse" } }
        next_cursor: { type: string }

    Problem:
      type: object
      required: [code]
      description: Why a page, an extraction, or a parse failed.
      properties:
        code:
          type: string
          enum: [file_not_found, file_too_large, invalid_pages, document_corrupt, unsupported_media_type, too_many_pages, source_unreachable, page_unreadable, figure_unreadable, reader_unavailable, reader_not_permitted, budget_exhausted, deadline_exceeded, schema_not_satisfied, internal]
        detail: { type: string }

    Usage:
      type: object
      properties:
        pages: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cost: { type: string, description: Present only when the model endpoint reported a cost. }
        currency: { type: string }

    UsageReport:
      type: object
      required: [by, interval, from, to, sums]
      properties:
        by: { type: string, enum: [group, owner, reader] }
        interval: { type: string, enum: [hour, day] }
        from: { type: string, format: date-time, description: The beginning of the first interval the read covers. }
        to: { type: string, format: date-time, description: The end of the last interval the read covers. }
        sums:
          type: array
          description: One per key and interval that has usage, by interval and then by key.
          items: { $ref: "#/components/schemas/UsageSum" }

    UsageSum:
      type: object
      required: [key, start, pages, calls, input_tokens, output_tokens]
      properties:
        key: { type: string, description: "The group, the owner or the reader the sum is of. Empty for the pages no reader read, when the key is the reader." }
        start: { type: string, format: date-time, description: The beginning of the interval. }
        pages: { type: integer, format: int64, description: Pages read. }
        calls: { type: integer, format: int64, description: "Model calls, those that failed or were told to wait included." }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }

    Queue:
      type: object
      required: [groups, pools]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/QueueGroup" } }
        pools: { type: array, items: { $ref: "#/components/schemas/QueuePool" } }

    QueueClass:
      type: object
      required: [class, queued, running]
      properties:
        class: { type: string, enum: [interactive, batch] }
        queued: { type: integer, description: Tasks that wait. }
        running: { type: integer, description: Tasks a worker holds. }

    QueueGroup:
      type: object
      required: [group, weight, max_running, max_queued, parses, classes, projects]
      properties:
        group: { type: string }
        weight: { type: integer, description: The group's share of service against other groups. }
        max_running: { type: integer, description: The most tasks of the group that run at once. 0 is no bound. }
        max_queued: { type: integer, description: The most parses of the group that have not ended. 0 is no bound. }
        parses: { type: integer, description: The group's parses that have not ended. }
        classes: { type: array, description: One per class the group has had work in., items: { $ref: "#/components/schemas/QueueClass" } }
        projects: { type: array, items: { $ref: "#/components/schemas/QueueProject" } }

    QueueProject:
      type: object
      required: [project, weight, parses, classes]
      properties:
        project: { type: string, description: Empty for the group's own project. }
        weight: { type: integer, description: The project's share of what its group is served. }
        parses: { type: integer, description: The project's parses that have not ended. }
        classes: { type: array, items: { $ref: "#/components/schemas/QueueClass" } }

    QueuePool:
      type: object
      required: [reader, max_in_flight, in_flight, breaker, scopes]
      properties:
        reader: { type: string }
        max_in_flight: { type: integer, description: The most calls to the reader at once, across every group. }
        in_flight: { type: integer, description: "Calls in flight: of every group, or of the groups the answer holds when it is narrowed to some." }
        breaker:
          type: string
          enum: [closed, open, trial]
          description: "`closed` admits calls. `open` admits none: the reader failed several times in a row. `trial` admits one call, whose outcome closes the breaker or opens it again."
        scopes:
          type: array
          description: The keys of the reader that a rate limit reached. A key that never was limited is not listed.
          items: { $ref: "#/components/schemas/QueueScope" }

    QueueScope:
      type: object
      required: [scope, ceiling, in_flight]
      properties:
        scope: { type: string, description: "Whose key it is: empty for the key every group shares, and the group for a key of its own." }
        ceiling: { type: integer, description: The most calls with the key at once as it stands. A rate limit halves it and quiet time restores it. }
        in_flight: { type: integer }
        paused_until: { type: string, format: date-time, description: When the pause of a rate limit ends. Absent when the key is not paused. }

    Kind:
      type: string
      description: What a block is. The set is closed; a label a reader returns outside it becomes `text`.
      enum: [title, heading, text, list_item, table, figure, formula, form, key_value, caption, footnote, page_header, page_footer, page_number, signature, barcode, code]

    Box:
      description: "`[x0, y0, x1, y1]` as fractions of the page's width and height, origin at the top left. Null when the position is unknown."
      type: [array, "null"]
      minItems: 4
      maxItems: 4
      items: { type: number, minimum: 0, maximum: 1 }

    Block:
      type: object
      required: [ref, kind, order, box, text]
      properties:
        ref: { type: string, description: "`<page>.<order>`, stable for the life of the parse." }
        kind: { $ref: "#/components/schemas/Kind" }
        order: { type: integer, minimum: 1, description: Reading order within the page. }
        box: { $ref: "#/components/schemas/Box" }
        text: { type: string, description: What is printed in the region, as plain text. A table's cells joined row by row; the words printed inside a figure. Transcription and nothing else. }
        description: { type: string, description: What a reader says a figure shows. The reader's own prose, kept apart from `text` because it is not what the document says. }
        figure: { $ref: "#/components/schemas/Figure" }
        level: { type: integer, minimum: 1, maximum: 6, description: The depth of a title or heading. }
        table: { $ref: "#/components/schemas/Table" }
        repeated: { type: boolean, description: A running header or footer after its first occurrence. }
        flags:
          type: array
          description: What validation did to the block.
          items: { type: string, enum: [box_clamped, kind_coerced, truncated] }

    Figure:
      type: object
      required: [type]
      description: What a describer found a figure to be. Present once the figure was described.
      properties:
        type: { type: string, enum: [diagram, chart, photo, table, other] }
        model: { type: string, description: The model that described the figure. }

    FiguresRequest:
      type: object
      additionalProperties: false
      properties:
        pages:
          type: string
          description: Limits the run to figures on these pages, in the syntax of a submit's `pages`. Absent means all.
        describer:
          type: string
          description: The name of a configured describer. Naming one pins it. Absent, the routing policy decides.
        redo:
          type: boolean
          default: false
          description: Describes again a figure that already has a description, and takes none from an earlier run.

    FigureRun:
      type: object
      required: [state, total, done, failed, usage, started_at]
      properties:
        state: { type: string, enum: [running, succeeded, failed], description: "`failed` when the run described none of the figures it set out to." }
        total: { type: integer, description: How many figures the run set out to describe. }
        done: { type: integer }
        failed: { type: integer }
        reused: { type: integer, description: How many of the figures done were taken from an earlier description and cost no call. }
        usage: { $ref: "#/components/schemas/Usage" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    FigureEntry:
      type: object
      required: [ref, page, box, text]
      properties:
        ref: { type: string }
        page: { type: integer }
        box: { $ref: "#/components/schemas/Box" }
        text: { type: string, description: The words printed inside the figure. }
        description: { type: string, description: What a describer says the figure shows. }
        figure: { $ref: "#/components/schemas/Figure" }
        error: { $ref: "#/components/schemas/Problem" }

    Figures:
      type: object
      required: [figures]
      properties:
        run: { $ref: "#/components/schemas/FigureRun" }
        figures: { type: array, items: { $ref: "#/components/schemas/FigureEntry" } }

    Table:
      type: object
      required: [rows, cols]
      properties:
        rows: { type: integer }
        cols: { type: integer }
        cells: { type: array, items: { $ref: "#/components/schemas/Cell" } }
        html: { type: string, description: The table's markup as it was produced, kept because it carries merged cells without loss. }

    Cell:
      type: object
      required: [row, col, text]
      properties:
        row: { type: integer, minimum: 0 }
        col: { type: integer, minimum: 0 }
        row_span: { type: integer, minimum: 2 }
        col_span: { type: integer, minimum: 2 }
        header: { type: boolean, description: A cell of a header row or column. }
        text: { type: string }
        box: { $ref: "#/components/schemas/Box" }

    Page:
      type: object
      required: [number, width, height, state, blocks]
      properties:
        number: { type: integer, minimum: 1 }
        width: { type: number, description: Points for paged formats, pixels for images. Boxes do not depend on it. }
        height: { type: number }
        rotation: { type: integer }
        state: { type: string, enum: [pending, succeeded, failed, skipped], description: "`skipped`: the parse ended, canceled or out of time, before the page was read." }
        source: { type: string, enum: [reader, native, text_layer], description: "Who produced the page's blocks. `reader`: a model read the page from its image. `native`: the format carried its own structure. `text_layer`: the blocks were built from the text the file carries for the page, with no model call; the page names its `reader` and no `model`." }
        reader: { type: string }
        model: { type: string }
        attempts: { type: integer }
        reused: { type: boolean, description: The result was taken from an earlier read of the same page by the same reader. No model was called for it in this parse. }
        truncated: { type: boolean, description: The reader's reply ended at its output limit. The blocks are what it finished, and the page may hold more. }
        blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        usage: { $ref: "#/components/schemas/Usage" }
        error: { $ref: "#/components/schemas/Problem" }

    PageSummary:
      type: object
      required: [number, state, blocks]
      properties:
        number: { type: integer }
        state: { type: string, enum: [pending, succeeded, failed, skipped] }
        source: { type: string, enum: [reader, native, text_layer] }
        blocks: { type: integer, description: How many blocks the page holds. }
        error: { $ref: "#/components/schemas/Problem" }

    PageList:
      type: object
      required: [pages]
      properties:
        pages: { type: array, items: { $ref: "#/components/schemas/PageSummary" } }

    Document:
      type: object
      required: [parse, pages, usage]
      properties:
        parse: { type: string }
        pages: { type: array, items: { $ref: "#/components/schemas/PageSummary" } }
        spans:
          type: array
          description: Tables that continue across pages, as joins of the table blocks that hold their parts.
          items:
            type: object
            required: [id, parts, rows, cols]
            properties:
              id: { type: string }
              parts: { type: array, items: { type: string } }
              rows: { type: integer }
              cols: { type: integer }
        outline:
          type: array
          items:
            type: object
            required: [ref, level, text, page]
            properties:
              ref: { type: string }
              level: { type: integer }
              text: { type: string }
              page: { type: integer }
        usage: { $ref: "#/components/schemas/Usage" }
        renderings: { type: array, items: { type: string } }
        fields: { type: array, items: { type: string } }

    Chunk:
      type: object
      required: [id, text, pages, blocks]
      properties:
        id: { type: string }
        text: { type: string }
        pages: { type: array, items: { type: integer } }
        blocks: { type: array, items: { type: string } }

    FieldRequest:
      type: object
      additionalProperties: false
      required: [name, schema]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_-]{0,62}$' }
        schema: { type: object, description: A JSON Schema, draft 2020-12, whose root is an object. }
        instructions: { type: string, maxLength: 4000 }
        citations: { type: boolean, default: true }
        extractor: { type: string, description: The name of a configured extractor. Absent, the routing policy decides. }

    Field:
      type: object
      required: [name, state, constrained]
      properties:
        name: { type: string }
        state:
          type: string
          enum: [pending, succeeded, failed]
          description: "`pending` from the request until the extraction ends, whether it waits for its parse to end, for its turn, or for a model."
        data: { description: "The object, in the shape of the schema. Present once the extraction succeeded." }
        citations:
          type: object
          description: A JSON pointer into `data`, to the blocks the value was read from. A ref the model named that is no block of the document is left out.
          additionalProperties:
            type: array
            items:
              description: The ref of a block, or with `resolve=true` the ref with its page and its box.
              oneOf:
                - { type: string }
                - { $ref: "#/components/schemas/Citation" }
        model: { type: string }
        constrained: { type: boolean, description: "Whether the schema was sent to be enforced by the model's decoding. A schema that uses what such decoding does not take is stated in the prompt alone." }
        attempts: { type: integer, description: "How many times the model was asked for a reply that satisfies the schema: 1, and 1 for each repair." }
        windows: { type: integer, description: "How many parts the document was read in. Above 1, the object was merged from the replies to each: lists joined, and of 2 other values the first that is not null." }
        usage: { $ref: "#/components/schemas/Usage" }
        error: { $ref: "#/components/schemas/Problem" }

    Citation:
      type: object
      required: [ref, page, box]
      properties:
        ref: { type: string }
        page: { type: integer }
        box: { $ref: "#/components/schemas/Box" }

    FieldList:
      type: object
      required: [fields]
      properties:
        fields: { type: array, items: { $ref: "#/components/schemas/Field" } }

    Reader:
      type: object
      required: [name, accepts, image, boxes]
      properties:
        name: { type: string }
        accepts: { type: array, items: { type: string } }
        image:
          type: object
          properties:
            dpi: { type: integer }
            long_edge: { type: integer }
            format: { type: string, enum: [png, jpeg] }
        boxes: { type: boolean, description: Whether the reader returns a position for each block. }
        kinds: { type: array, items: { $ref: "#/components/schemas/Kind" } }
        version: { type: string, description: Names everything in the reader's configuration that changes what it returns for the same page. Pages are reused only between readers of the same version. }
        default: { type: boolean, description: Whether the routing policy tries this reader first. }

    ReaderList:
      type: object
      required: [readers]
      properties:
        readers: { type: array, items: { $ref: "#/components/schemas/Reader" } }
