# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/lectio/

license:
  spdx: Apache-2.0
  holder: Latere AI

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The identity shape shared across the open cores. The verifier and the
# authorizer client of spec 012 are not built yet: the development server
# takes one static token and no production mode exists, so there is no
# audience to declare until that spec lands.
identity:
  role: none

# No Postgres client exists yet. The store of spec 004 declares the pooled
# role, with LECTIO_DATABASE_URL for migrations and LECTIO_DATABASE_POOL_URL
# for serving.
postgres:
  role: none
