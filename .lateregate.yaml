# The gate configuration for lectio.
#
# Only the spec tree is configured: the repository holds specs and no code
# yet. The remaining blocks (license, identity, postgres, cover) arrive with
# the scaffold, specs/016-distribution.md.

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]
