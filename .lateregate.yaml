# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/lectio/

license:
  spdx: Apache-2.0
  holder: Latere AI

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The identity shape shared across the open cores (spec 012): lectiod
# verifies one token against the issuers it is given, hands every claim to
# the authorizer it asks, and reads none of them. internal/access holds the
# verifier and the authorizer client; the handlers do not call them yet.
identity:
  role: core
  audience: lectio
  config_prefix: LECTIO
  # The group the Reader and Policy documents are written under.
  api_group: lectio.latere.ai
  # The audience is the default of a server somebody runs themselves, and
  # no client is registered anywhere to present it.
  reached_by: self-hosted

# The store of spec 004 serves through LECTIO_DATABASE_POOL_URL where an
# installation names a pooled endpoint and falls back to LECTIO_DATABASE_URL.
# Migrations always take the direct one: the migrator holds a session lock
# across its statements, which a transaction-mode pooler loses between two.
postgres:
  role: pooled
  prefix: LECTIO
