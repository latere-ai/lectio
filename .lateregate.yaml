# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/lectio/
  exempt:
    internal/testservers: >-
      starts the containers the suites run against; the lines no run reaches
      are the ones for a container runtime that fails

# The tag each production image runs is rewritten in the same commit as the
# changelog section, so deploy/prod/kustomization.yaml never lags a release.
# One entry for each image: a pattern must match its file exactly once.
release:
  stamp:
    - file: deploy/prod/kustomization.yaml
      pattern: 'newName: ghcr\.io/latere-ai/lectiod\n    newTag: v\d+\.\d+\.\d+'
    - file: deploy/prod/kustomization.yaml
      pattern: 'newName: ghcr\.io/latere-ai/lectio-convert\n    newTag: v\d+\.\d+\.\d+'

license:
  spdx: Apache-2.0
  holder: Latere AI

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# The identity shape shared across the open cores (spec 012): lectiod
# verifies one token against the issuers it is given, hands every claim to
# the authorizer it asks, and reads none of them. internal/access holds the
# verifier and the authorizer client, and every handler of internal/httpapi
# authenticates and asks through it.
identity:
  role: core
  audience: lectio
  config_prefix: LECTIO
  # The group the Reader and Policy documents are written under.
  api_group: lectio.latere.ai
  # The audience is the default of a server somebody runs themselves, and
  # no client is registered anywhere to present it.
  reached_by: self-hosted
  # The conversion sidecar is a command of this repository, so the
  # deployment rules would hold its container to naming an audience. It
  # verifies no token: it takes one call from the workers, behind a
  # network policy, and holds no credential (spec 009). Its manifest is
  # held by deploy_test.go instead.
  skip:
    - deploy/components/converter/deployment.yaml
    # deploy/prod is the maintainer's own overlay inside the core's tree; it
    # names the installation it serves, so the no-installation-value rule
    # reads the addresses it sets and does not refuse them.
    - deploy/prod
  overlays:
    - deploy/prod

# The store of spec 004 serves through LECTIO_DATABASE_POOL_URL where an
# installation names a pooled endpoint and falls back to LECTIO_DATABASE_URL.
# Migrations always take the direct one: the migrator holds a session lock
# across its statements, which a transaction-mode pooler loses between two.
postgres:
  role: pooled
  prefix: LECTIO

# The server image: it builds, names its version, stays under the size the
# distribution spec holds it to, has no shell, and starts and answers with a
# read-only root file system and no capability. It runs its default command.
image:
  images:
    - name: lectiod
      version_args: [version]
      version_expect: "lectiod "
      max_mib: 60
      env:
        LECTIO_DEV: "true"
      port: 8080
      probe: /v1/openapi.yaml
