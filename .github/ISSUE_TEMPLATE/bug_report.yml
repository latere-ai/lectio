name: Bug report
description: Something Lectio does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/lectio/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I parsed a two-page PDF and the second page came back with no blocks ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest sequence that shows it: the kind of file, the requests,
        and the answer with its error code. Attach a file only if it is
        yours to publish. Redact tokens and keys.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image digest, from `lectiod version` or the `Lectio-Version` header of any answer.
      placeholder: v0.9.1
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - The development server (LECTIO_DEV=true)
        - The durable server, API and workers in one process
        - The durable server, roles apart
    validations:
      required: true

  - type: input
    id: reader
    attributes:
      label: Reader
      description: The reader and the model that read the page, from the page's `reader` and `model` in the result.
      placeholder: default, your-vision-model

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from lectiod's log. Redact tokens and hostnames you
        would rather not publish.
      render: text
