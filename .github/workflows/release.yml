# The release pipeline, on a v* tag, through the shared image release
# stages. The build stage requires that the tag's commit passed verify,
# checks the tag and its CHANGELOG section, builds the 2 images, lectiod
# and the lectio-convert sidecar, for linux/amd64 and linux/arm64, pushes
# each by digest and under no tag, checks each candidate reports the
# version the tag pins, signs each, and gives each a bill of materials and
# SBOM and provenance attestations; then it archives the deploy tree with
# both images pinned by digest. Only then does the publish stage tag the
# digests, sign checksums.txt over the archive and the bills of materials,
# and publish the GitHub release with the CHANGELOG section as its body.
# The verify stage then checks the published release the way SECURITY.md
# tells an installer to.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # Both binaries answer `version` with "<name> <tag> (<commit>, <date>)".
      # The sidecar's image installs an office suite with the package
      # manager, so the arm64 half of that stage runs under the emulation
      # the build stage sets up.
      image_1: '{"name": "lectiod", "version_args": "version", "version_expect": "{name} {tag} ("}'
      image_2: '{"name": "lectio-convert", "dockerfile": "deploy/converter/Dockerfile", "version_args": "version", "version_expect": "{name} {tag} ("}'
      # The deploy archive: the deploy tree with both images pinned to this
      # release by digest, cut from the <ref>@<digest> of each. The script
      # renders every overlay before it writes the archive, so one that
      # does not build never reaches the release page.
      after_images_command: |
        REGISTRY="${IMAGE_1%%/*}" LECTIOD_DIGEST="${IMAGE_1#*@}" CONVERT_DIGEST="${IMAGE_2#*@}" \
          tools/release/deploy-archive.sh "$TAG" dist
      runs_on: ubuntu-latest

  publish:
    needs: build
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        lectiod
        lectio-convert
      runs_on: ubuntu-latest
