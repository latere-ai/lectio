# The release pipeline, on a v* tag, through the shared image release
# stages. The build stage requires that the tag's commit passed verify,
# checks the tag and its CHANGELOG section, builds the 2 images, lectiod
# and the lectio-convert sidecar, for linux/amd64 and linux/arm64, pushes
# each by digest and under no tag, checks each candidate reports the
# version the tag pins, signs each, and gives each a bill of materials and
# SBOM and provenance attestations; then it archives the deploy tree with
# both images pinned by digest. The deploy stage then rolls the maintainer's
# own installation, only where the repository variable LECTIO_RELEASE_DEPLOY
# is set: deploy/prod applied with both images pinned by digest, the three
# Deployments waited for, and tools/smoke/release.sh repeated against the
# live origin. Only then does the publish stage tag the digests, sign
# checksums.txt over the archive and the bills of materials, and publish the
# GitHub release with the CHANGELOG section as its body and the smoke
# evidence appended. The verify stage then checks the published release the
# way SECURITY.md tells an installer to.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # Both binaries answer `version` with "<name> <tag> (<commit>, <date>)".
      # The sidecar's image installs an office suite with the package
      # manager, so the arm64 half of that stage runs under the emulation
      # the build stage sets up.
      image_1: '{"name": "lectiod", "version_args": "version", "version_expect": "{name} {tag} ("}'
      image_2: '{"name": "lectio-convert", "dockerfile": "deploy/converter/Dockerfile", "version_args": "version", "version_expect": "{name} {tag} ("}'
      # The deploy archive: the deploy tree with both images pinned to this
      # release by digest, cut from the <ref>@<digest> of each. The script
      # renders every overlay before it writes the archive, so one that
      # does not build never reaches the release page.
      after_images_command: |
        REGISTRY="${IMAGE_1%%/*}" LECTIOD_DIGEST="${IMAGE_1#*@}" CONVERT_DIGEST="${IMAGE_2#*@}" \
          tools/release/deploy-archive.sh "$TAG" dist
      runs_on: ubuntu-latest

  # The shared deploy stage, under the production environment, so the
  # rollout is a GitHub deployment with a URL on the repository's
  # Deployments page. The repository variable and the kubeconfig secret are
  # set on this repository and on no fork, so a tag on a fork publishes
  # every artifact and skips this job. Each image is given by digest, as the
  # overlay's own name for it, because it carries no tag until publish.
  # deploy/prod holds only re-appliable manifests; deploy/prod-bootstrap is
  # never read.
  deploy:
    name: deploy and smoke
    # build is named for its outputs: a job reads the outputs of the jobs it
    # needs directly, and of no other.
    needs: build
    if: ${{ vars.LECTIO_RELEASE_DEPLOY != '' }}
    uses: latere-ai/ci/.github/workflows/image-deploy.yml@v1
    permissions:
      contents: read
    with:
      images: |
        lectiod=${{ needs.build.outputs.ref_1 }}@${{ needs.build.outputs.digest_1 }}
        lectio-convert=${{ needs.build.outputs.ref_2 }}@${{ needs.build.outputs.digest_2 }}
      deployments: |
        lectiod
        lectiod-worker
        lectio-convert
      url: https://api.latere.ai/v1/parsing
      runs_on: ubuntu-latest
    secrets:
      DEPLOY_KUBECONFIG: ${{ secrets.LECTIO_KUBECONFIG }}

  publish:
    needs: [build, deploy]
    # deploy is skipped on every repository that sets no LECTIO_RELEASE_DEPLOY,
    # and a job that leans on the implicit success() is skipped whenever a
    # job above it in the graph is, so each result is named here.
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      # The smoke evidence is the run artifact the deploy stage uploads. A
      # release whose deploy was skipped has none, and the publish stage
      # refuses an evidence pattern that names no file, so it is named only
      # when the deploy ran.
      evidence: ${{ needs.deploy.result == 'success' && 'smoke-evidence' || '' }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    # deploy sits above this job in the graph and is skipped on a fork, so
    # the result this job waits on is named, as on publish.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        lectiod
        lectio-convert
      runs_on: ubuntu-latest
