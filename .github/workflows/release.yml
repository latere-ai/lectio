# The release pipeline, on a v* tag: the tag's commit must have passed
# verify; the 2 images, lectiod and the lectio-convert sidecar, are built
# from the tag for linux/amd64 and linux/arm64, each pushed by digest and
# under no tag, signed, and given a bill of materials and a provenance
# attestation; each candidate must report the version the tag pins; the
# deploy tree is archived with both images pinned by digest; only then are
# the digests tagged, the GitHub release is created with the CHANGELOG
# section as its body by the shared notes pipeline, and the archive, the
# bills of materials and their signed checksums are attached to it.
#
# Nothing here pushes to the default branch, no job carries a permission
# another needs, and the image namespace is the repository owner's, so a
# fork's tag publishes under the fork's. Every third-party action is pinned
# by commit with its version in a comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: lectiod
  CONVERT_IMAGE: lectio-convert

jobs:
  # 1. The verify run for the push of this very commit concluded success.
  # `lateregate release` pushes the branch and the tag in one push, so the
  # run exists by now and may still be running; a tag on a commit whose
  # gate never ran, or ran red, fails here and publishes nothing. The run
  # the tag's own push starts skips every job, so it is not the one read.
  gate-green:
    name: the tag's commit passed verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the verify run on this commit and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 110); do
            # $ENV is jq's, which reads the tag from the environment.
            # shellcheck disable=SC2016
            conclusions=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_branch != $ENV.GITHUB_REF_NAME) | .conclusion // "running"] | join(" ")')
            case " $conclusions " in
              *" success "*) echo "verify concluded success on ${GITHUB_SHA}"; exit 0 ;;
              *" failure "*|*" cancelled "*|*" timed_out "*|*" startup_failure "*|*" action_required "*)
                echo "verify concluded '$conclusions' on ${GITHUB_SHA}; a release is cut from a green tree" >&2; exit 1 ;;
            esac
            if [ -z "$conclusions" ] && [ "$i" -gt 10 ]; then
              echo "no verify run exists for the push of ${GITHUB_SHA}; tag a commit whose gate ran" >&2; exit 1
            fi
            sleep 30
          done
          echo "verify did not conclude on ${GITHUB_SHA} within the hour" >&2; exit 1

  # 2. The 2 images, built from this checkout with the tag's build
  # identity. Each is pushed by digest and under no tag, so a run that
  # stops before the digests are tagged leaves unreferenced digests and
  # nothing an operator could pull by accident.
  build:
    name: the images by digest and the deploy archive
    needs: gate-green
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
      digest: ${{ steps.image.outputs.digest }}
      convert: ${{ steps.convert.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The namespace is the account that pushed the tag, lowered, read
      # here and written nowhere in the tree. A repository variable
      # overrides it, for an installation that publishes elsewhere.
      - name: The image namespace is the repository owner's
        id: owner
        env:
          OVERRIDE: ${{ vars.RELEASE_IMAGE_NAMESPACE }}
        run: |
          owner=${OVERRIDE:-$GITHUB_REPOSITORY_OWNER}
          echo "owner=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: The tag has a CHANGELOG section
        run: go tool lateregate release-notes "${GITHUB_REF_NAME}" > /dev/null
      # An image tag cannot carry SemVer build metadata, and the deploy
      # overlays name the images by the git tag.
      - name: The tag is a valid image tag
        run: |
          case "${GITHUB_REF_NAME}" in
            *+*) echo "${GITHUB_REF_NAME} carries build metadata, which an image tag cannot; cut a tag without it" >&2; exit 1 ;;
          esac
      # The build identity both binaries report, the same 3 values `make
      # build` stamps.
      - name: The build identity of the tag
        id: identity
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The Go stage of both images runs on the runner's own platform and
      # cross-compiles. The sidecar's image also installs an office suite
      # with the package manager, so the arm64 half of that stage runs
      # under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push lectiod by digest, under no tag
        id: image
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DATE: ${{ steps.identity.outputs.date }}
        run: |
          mkdir -p out
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" --build-arg "COMMIT=${COMMIT}" --build-arg "DATE=${DATE}" \
            --output "type=image,name=${REGISTRY}/${OWNER}/${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file out/image.json .
          digest=$(jq -r '."containerimage.digest"' out/image.json)
          echo "the candidate is ${REGISTRY}/${OWNER}/${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Build and push lectio-convert by digest, under no tag
        id: convert
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DATE: ${{ steps.identity.outputs.date }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/converter/Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" --build-arg "COMMIT=${COMMIT}" --build-arg "DATE=${DATE}" \
            --output "type=image,name=${REGISTRY}/${OWNER}/${CONVERT_IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file out/convert.json .
          digest=$(jq -r '."containerimage.digest"' out/convert.json)
          echo "the sidecar is ${REGISTRY}/${OWNER}/${CONVERT_IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # Each candidate reports the build identity this tag pins, so the
      # binary inside is the one compiled from the tag.
      - name: The images report the version this tag pins
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          LECTIOD_DIGEST: ${{ steps.image.outputs.digest }}
          CONVERT_DIGEST: ${{ steps.convert.outputs.digest }}
        run: |
          reports() {
            got=$(docker run --rm "$1" version)
            echo "$got"
            case "$got" in
              "$2 ${GITHUB_REF_NAME} ("*) ;;
              *) echo "the image reports '$got' and the tag is ${GITHUB_REF_NAME}" >&2; exit 1 ;;
            esac
          }
          reports "${REGISTRY}/${OWNER}/${IMAGE}@${LECTIOD_DIGEST}" lectiod
          reports "${REGISTRY}/${OWNER}/${CONVERT_IMAGE}@${CONVERT_DIGEST}" lectio-convert
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the 2 images by digest with the workflow's identity
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          LECTIOD_DIGEST: ${{ steps.image.outputs.digest }}
          CONVERT_DIGEST: ${{ steps.convert.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${OWNER}/${IMAGE}@${LECTIOD_DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/${CONVERT_IMAGE}@${CONVERT_DIGEST}"
      - name: The bill of materials of lectiod
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectiod@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/sbom-lectiod.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the bill of materials of lectiod
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectiod
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/sbom-lectiod.spdx.json
          push-to-registry: true
      - name: Attest the provenance of lectiod
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectiod
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: The bill of materials of lectio-convert
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectio-convert@${{ steps.convert.outputs.digest }}
          format: spdx-json
          output-file: dist/sbom-lectio-convert.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the bill of materials of lectio-convert
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectio-convert
          subject-digest: ${{ steps.convert.outputs.digest }}
          sbom-path: dist/sbom-lectio-convert.spdx.json
          push-to-registry: true
      - name: Attest the provenance of lectio-convert
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/lectio-convert
          subject-digest: ${{ steps.convert.outputs.digest }}
          push-to-registry: true
      # The deploy archive: the deploy tree with both images pinned to this
      # release by digest. The script renders every overlay before it
      # writes the archive, so one that does not build never reaches the
      # release page.
      - name: The deploy archive with both images pinned by digest
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          LECTIOD_DIGEST: ${{ steps.image.outputs.digest }}
          CONVERT_DIGEST: ${{ steps.convert.outputs.digest }}
        run: tools/release/deploy-archive.sh "${GITHUB_REF_NAME}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 3. Only now do the digests get the :<tag> reference.
  publish:
    name: tag the digests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ needs.build.outputs.owner }}
      LECTIOD_DIGEST: ${{ needs.build.outputs.digest }}
      CONVERT_DIGEST: ${{ needs.build.outputs.convert }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Tag the 2 digests
        run: |
          docker buildx imagetools create -t "${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${OWNER}/${IMAGE}@${LECTIOD_DIGEST}"
          docker buildx imagetools create -t "${REGISTRY}/${OWNER}/${CONVERT_IMAGE}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${OWNER}/${CONVERT_IMAGE}@${CONVERT_DIGEST}"
          echo "published ${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME} at ${LECTIOD_DIGEST}"
          echo "published ${REGISTRY}/${OWNER}/${CONVERT_IMAGE}:${GITHUB_REF_NAME} at ${CONVERT_DIGEST}"

  # 4. The GitHub release, with the CHANGELOG section for the tag as its
  # body, created by the shared notes pipeline once the images it
  # announces are tagged.
  release:
    needs: publish
    permissions:
      contents: write
    uses: latere-ai/ci/.github/workflows/notes-release.yml@v1
    secrets: inherit

  # 5. What the release carries beside its notes: the deploy archive, the 2
  # bills of materials, and their checksums with a signature that names
  # this workflow. The notes pipeline creates the release and attaches
  # nothing, so the files join it here. A run that stops between the 2
  # jobs leaves a release without them, and running this job again
  # attaches them.
  assets:
    name: attach the deploy archive and the bills of materials
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The checksums, and the signature over them
        run: |
          cd dist
          sha256sum "deploy-${GITHUB_REF_NAME}.tar.gz" sbom-lectiod.spdx.json sbom-lectio-convert.spdx.json | tee checksums.txt
          # One Sigstore bundle carries the signature and the certificate.
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "dist/deploy-${GITHUB_REF_NAME}.tar.gz" dist/sbom-lectiod.spdx.json dist/sbom-lectio-convert.spdx.json \
            dist/checksums.txt dist/checksums.txt.sigstore.json
